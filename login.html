<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIN — DSTRK</title>
<style>
:root{--ink:#111;--line:#e8e8e8;--soft:#f6f6f4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}.nav{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 5%;border-bottom:1px solid var(--line)}
.back,.shop{font-size:10px;letter-spacing:1.6px}.shop{justify-self:end}.brand{font-size:22px;font-weight:900;letter-spacing:7px}
.wrap{min-height:calc(100svh - 76px);display:grid;grid-template-columns:1fr 1fr}
.visual{background:linear-gradient(0deg,rgba(0,0,0,.25),rgba(0,0,0,.05)),url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1400&q=85') center/cover;min-height:600px}
.panel{padding:10vw;display:flex;align-items:center}.form{width:min(440px,100%)}.kicker{font-size:10px;letter-spacing:2px;color:#777}.form h1{font-size:clamp(50px,7vw,96px);letter-spacing:-.07em;line-height:.85;margin:24px 0 36px}
.field{margin-bottom:16px}.field label{display:block;font-size:9px;letter-spacing:1.6px;color:#777;margin-bottom:8px}.field input{width:100%;border:0;border-bottom:1px solid #111;padding:13px 0;outline:0;font-size:14px}
.login{width:100%;margin-top:24px;padding:18px;border:0;background:#111;color:#fff;font-size:10px;letter-spacing:2px;cursor:pointer}.note{font-size:11px;line-height:1.8;color:#777;margin-top:20px}.status{display:none;margin-top:18px;font-size:12px}.status.show{display:block}
@media(max-width:760px){.nav{height:64px}.brand{font-size:18px}.wrap{grid-template-columns:1fr}.visual{display:none}.panel{min-height:calc(100svh - 64px);padding:12vw 7vw}.form h1{font-size:62px}}
</style>
</head>
<body>
<nav class="nav"><a class="back" href="index.html">← BACK</a><a class="brand" href="index.html">DSTRK</a><a class="shop" href="index.html#shop">SHOP →</a></nav>
<main class="wrap">
  <div class="visual"></div>
  <div class="panel">
    <form class="form" id="loginForm">
      <div class="kicker">DSTRK ACCOUNT</div>
      <h1>WELCOME<br>BACK.</h1>
      <div class="field"><label>EMAIL</label><input type="email" id="email" required placeholder="you@email.com"></div>
      <div class="field"><label>PASSWORD</label><input type="password" id="password" required placeholder="••••••••"></div>
      <button class="login" type="submit">LOGIN</button>
      <div class="status" id="status"></div>
      <p class="note">현재는 브랜드 사이트 데모 로그인입니다. 입력한 이메일을 이 브라우저에 저장해 로그인 상태를 표시합니다.</p>
    </form>
  </div>
</main>
<script>
const form=document.getElementById('loginForm'), status=document.getElementById('status');
const saved=localStorage.getItem('dstrk-user');
if(saved){status.textContent=`${saved} 계정으로 로그인되어 있습니다.`;status.classList.add('show')}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  localStorage.setItem('dstrk-user',email);
  status.textContent='로그인되었습니다. DSTRK로 돌아갑니다.';
  status.classList.add('show');
  setTimeout(()=>location.href='index.html',700);
});
</script>
</body>
</html>
