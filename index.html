<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSTRK ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f6f4;color:#111}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{background:#fff;width:min(430px,100%);padding:42px;border:1px solid #e5e5e5}
.logo{font-size:30px;font-weight:900;letter-spacing:8px}.kicker{font-size:10px;letter-spacing:2px;color:#777;margin-top:10px}
.field{margin-top:22px}.field label{display:block;font-size:10px;letter-spacing:1.4px;color:#777;margin-bottom:8px}.field input{width:100%;border:0;border-bottom:1px solid #111;padding:12px 0;outline:0;background:transparent}
.primary{width:100%;margin-top:28px;border:0;background:#111;color:#fff;padding:16px;font-size:11px;letter-spacing:1.7px}.error{font-size:12px;margin-top:16px;color:#b00020}
.app{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:5}.top .brand{font-weight:900;letter-spacing:5px}.top small{color:#777;margin-right:18px}.logout{background:none;border:1px solid #111;padding:9px 14px;font-size:10px;letter-spacing:1.3px}
.wrap{padding:34px 4%;max-width:1500px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid #e1e1e1;padding:22px}.stat label{font-size:9px;letter-spacing:1.5px;color:#777}.stat strong{display:block;font-size:30px;margin-top:12px}
.tabs{display:flex;gap:8px;margin:28px 0 14px}.tab{border:1px solid #ccc;background:#fff;padding:12px 18px;font-size:10px;letter-spacing:1.3px}.tab.active{background:#111;color:#fff;border-color:#111}
.panel{background:#fff;border:1px solid #e1e1e1;padding:20px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{border:1px solid #ccc;padding:11px 12px;width:min(380px,100%)}.refresh{border:1px solid #111;background:#fff;padding:10px 14px;font-size:10px;letter-spacing:1px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}th{font-size:9px;letter-spacing:1.2px;color:#777;white-space:nowrap}td.money{text-align:right;white-space:nowrap}.muted{color:#777}.badge{display:inline-block;padding:5px 7px;background:#eee;font-size:9px;letter-spacing:.5px}.badge.paid{background:#111;color:#fff}.detail{white-space:pre-line;line-height:1.6}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:22px 4%}.top{padding:0 4%}.top small{display:none}.login-card{padding:30px}}
</style>
</head>
<body>
<section class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="logo">DSTRK</div><div class="kicker">PRIVATE ADMIN</div>
    <div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="primary">ENTER ADMIN</button><div class="error" id="loginError"></div>
  </form>
</section>

<section class="app hidden" id="appView">
<header class="top"><div class="brand">DSTRK / ADMIN</div><div><small id="adminEmail"></small><button class="logout" id="logout">LOGOUT</button></div></header>
<main class="wrap">
  <div class="stats">
    <div class="stat"><label>CUSTOMERS</label><strong id="statCustomers">0</strong></div>
    <div class="stat"><label>ORDERS</label><strong id="statOrders">0</strong></div>
    <div class="stat"><label>PAID SALES</label><strong id="statPaid">₩0</strong></div>
    <div class="stat"><label>PENDING PAYMENTS</label><strong id="statPending">0</strong></div>
  </div>
  <div class="tabs"><button class="tab active" data-tab="orders">ORDERS</button><button class="tab" data-tab="customers">CUSTOMERS</button></div>
  <section class="panel" id="ordersPanel">
    <div class="toolbar"><input class="search" id="orderSearch" placeholder="주문번호 / 이름 / 이메일 검색"><button class="refresh" onclick="loadOrders()">REFRESH</button></div>
    <div class="table-wrap"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>ITEMS</th><th>AMOUNT</th><th>PAYMENT</th><th>STATUS</th><th>DATE</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
  </section>
  <section class="panel hidden" id="customersPanel">
    <div class="toolbar"><input class="search" id="customerSearch" placeholder="이름 / 이메일 / 전화번호 검색"><button class="refresh" onclick="loadCustomers()">REFRESH</button></div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>CUSTOMER</th><th>CONTACT</th><th>ADDRESS</th><th>ORDERS</th><th>PAID TOTAL</th><th>JOINED</th></tr></thead><tbody id="customersBody"></tbody></table></div>
  </section>
</main>
</section>
<script>
const $=id=>document.getElementById(id);
const won=n=>new Intl.NumberFormat('ko-KR').format(Number(n||0))+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'요청 실패');return data}
async function boot(){
 try{const me=await api('/api/admin/me');$('adminEmail').textContent=me.email;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await Promise.all([loadStats(),loadOrders(),loadCustomers()])}
 catch{}
}
async function loadStats(){const s=await api('/api/admin/stats');$('statCustomers').textContent=s.customers;$('statOrders').textContent=s.orders;$('statPaid').textContent=won(s.paid);$('statPending').textContent=s.pending}
async function loadOrders(){
 try{const q=$('orderSearch').value.trim();const rows=await api('/api/admin/orders?'+new URLSearchParams({q}));$('ordersBody').innerHTML=rows.map(o=>{
 const items=o.items.map(i=>`${esc(i.name)} / ${esc(i.size)} × ${i.quantity}`).join('<br>');
 return `<tr><td><strong>${esc(o.order_no)}</strong></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.customer_email)}</span><br>${esc(o.customer_phone)}</td><td>${items}</td><td class="money">${won(o.total)}<br><span class="muted">상품 ${won(o.subtotal)}<br>런칭 -${won(o.launch_discount)}</span></td><td><span class="badge ${o.payment_status==='PAID'?'paid':''}">${esc(o.payment_status)}</span></td><td>${esc(o.order_status)}</td><td>${esc(o.created_at)}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">주문이 없습니다.</td></tr>'}
 catch(e){alert(e.message)}
}
async function loadCustomers(){
 try{const q=$('customerSearch').value.trim();const rows=await api('/api/admin/customers?'+new URLSearchParams({q}));$('customersBody').innerHTML=rows.map(c=>`<tr><td>${c.id}</td><td><strong>${esc(c.name)}</strong><br>${esc(c.email)}</td><td>${esc(c.phone)}</td><td class="detail">${esc(c.address)||'-'}</td><td>${c.order_count}</td><td class="money">${won(c.paid_total)}</td><td>${esc(c.created_at)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">고객이 없습니다.</td></tr>'}
 catch(e){alert(e.message)}
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});boot()}catch(err){$('loginError').textContent=err.message}});
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('ordersPanel').classList.toggle('hidden',b.dataset.tab!=='orders');$('customersPanel').classList.toggle('hidden',b.dataset.tab!=='customers')});
$('orderSearch').addEventListener('input',()=>loadOrders());$('customerSearch').addEventListener('input',()=>loadCustomers());
boot();
</script>
</body></html>
